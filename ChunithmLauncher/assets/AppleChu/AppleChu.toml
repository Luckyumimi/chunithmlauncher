## 这是 AppleChu 的 TOML 配置文件
##
## - 井号 # 开头的行为注释，被注释掉的内容不会生效
## - 被注释的配置内容使用一个井号 #，说明文字使用两个井号 ##
## - 功能开关统一使用 enable = true/false
## - 未填写的配置使用程序默认值

config_version = 1

## AM Daemon
[Amdaemon]
## 启用
enable = true
## 由游戏侧启动 AM Daemon
AutoStart = true
## 可执行文件
Executable = "amdaemon.exe"
## 隐藏控制台窗口
HideWindow = true
## 退出时终止
TerminateOnExit = true
## 补充 JSON 参数
AppendConfigArgs = true
## AM Daemon JSON 配置文件列表
ConfigFiles = ["config_*.json"]

## 机台序列号模拟
[PCBID]
## 机台序列号
#serialNo = "ACAE01A99999999"

## 虚拟文件系统
[VFS]
## AMFS 目录
#amfs = "amfs"
## APPDATA 目录
#appdata = "appdata"
## 选项资源目录
option = "../option"
## 允许写入 AMFS 下载内容
#allowAmfsDownloads = false

## AM 平台 DNS 映射
[Dns]
## 启用
enable = true
## 默认服务器
#default = ""
## 店内路由服务器
#router = ""
## 启动认证服务器
#startup = ""
## 计费服务器
#billing = ""
## AimeDB 服务器
#aimedb = ""
## 标题服务器
#title = ""
## 替换 HTTP Host
#replaceHost = false
## 启动认证端口
#startupPort = 0
## 计费端口
#billingPort = 0
## AimeDB 端口
#aimedbPort = 0

## NuSec/keychip 模拟
[Keychip]
## 启用
enable = true
## Keychip ID
id = "A69E-01A88888888"
## 游戏 ID
#gameId = "SDHD"
## 平台 ID
#platformId = ""
## 区域编号
#region = 1
## 计费类型
#billingType = 1
## 系统标志
#systemFlag = 100
## 店内网络子网
#subnet = "192.168.139.0"
## 计费 CA 证书
#billingCa = 'DEVICE\ca.crt'
## 计费公钥
#billingPub = 'DEVICE\billing.pub'

## 店内网络适配器模拟
[NetEnv]
## 启用
enable = true
## 机台 IP 末尾地址
#addrSuffix = 11
## 路由 IP 末尾地址
#routerSuffix = 254
## 虚拟网卡 MAC
#macAddr = "01:02:03:04:05:06"
## UDP 广播地址
#broadcast = "255.255.255.255"

## 系统设置
[System]
## 启用
enable = true
## 开启控制台
EnableConsole = false
## 店内联机从机模式
#LanSlave = false
## 机台模式
Mode = "SP"
## 刷新率
RefreshRate = 120

## 自定义版本号
[General]
## 启用
enable = false
## 内容
#version_text = ""

## 显示设置
[Window]
## 启用
enable = true
## 窗口运行
windowed = true
## 显示窗口边框
framed = false
## 显示器编号
#monitor = 0

## 跳过启动画面
[SkipStartup]
## 启用
enable = false

## 免费游玩
[FreePlay]
## 启用
enable = false
## 自定义显示文本
#custom_text = ""

## 禁用选歌计时器
[DisableTimer]
## 启用
enable = false

## 跳过地图动画
[SkipMapAnimation]
## 启用
enable = false

## 解锁游戏内容
[Unlocker]
## 在内存中解锁内容，不修改资源文件
## 启用
enable = false
## 解锁角色
#unlockChara = true
## 解锁乐曲
#unlockMusic = true
## 解锁铭牌
#unlockNamePlate = true
## 解锁系统语音
#unlockSystemVoice = true
## 解锁活动
#unlockEvent = true
## 解锁跑图小人
#unlockMapIcon = true
## 解锁称号
#unlockTrophy = true

## 解锁曲数上限
[UnlockTracks]
## 启用
enable = false
## 最大曲数
#max = 3

## 自定义计时器
[CustomTimers]
## 启用
enable = false
## 地图选择
#map_select = 60
## 票券选择
#ticket_select = 60
## 课题选择
#course_select = 60

## 自动游玩
[Autoplay]
## 只屏蔽成绩数据，角色/设置/地图进度正常保存
## 启用
enable = false
## 切换键
#hotkey = "Home"

## 解锁 120fps
[Unlock120fps]
## 启用
enable = false

## 绕过 1080P 检测
[Bypass1080p]
## 启用
enable = false

## 绕过 120Hz 检测
[Bypass120hz]
## 启用
enable = false

## DPI 感知
[DpiAware]
## 启用
enable = true

## 强制共享音频
[ForceSharedAudio]
## 系统采样率必须为 48000Hz，可能增加延迟
## 启用
enable = false

## 强制双声道
[Force2chAudio]
## 启用
enable = false

## 关闭网络加密
[DisableEncryption]
## 私服联网需要开启
## 启用
enable = true

## 关闭 TLS
[DisableTLS]
## 启用
enable = true

## 网络请求日志
[NetLog]
## 启用
enable = false

## 绕过 AppUser 检测
[BypassAppUser]
## 启用
enable = true

## FPS 显示
[FpsDisplay]
## 需要 d3d9 proxy
## 启用
enable = false

## 帧率锁定
[FrameLock]
## 需要 d3d9 proxy
## 启用
enable = false
## 目标帧率
#fps = 60

## 控制器 IO DLL
[ChuniIo]
## 启用
enable = true
## DLL 路径
#path = ""
## 32 位 DLL 路径
#path32 = ""
## 64 位 DLL 路径
#path64 = ""

## 读卡器 IO DLL
[AimeIo]
## 启用
enable = true
## DLL 路径
#path = ""
## 32 位 DLL 路径
#path32 = ""
## 64 位 DLL 路径
#path64 = ""

## 按键输入
[Buttons]
