<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活动管理 · CHUNITHM Launcher</title>
  <style>
    :root{color-scheme:light;--bg:#f5f2f9;--paper:#fff;--control:#f4f2f6;--ink:#332f3c;--muted:#7d7787;--line:#e3dfe8;--accent:#fdd500;--focus-border:#c1aa1a;--focus-bg:#fffbea;--shadow: none}
    [data-theme=dark]{color-scheme:dark;--bg:#000;--paper:#222;--control:#333;--ink:#f2f2f2;--muted:#d1d1d1;--line:#454545;--focus-border:#fdd500;--focus-bg:#454545;--shadow: none}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Microsoft YaHei",system-ui,sans-serif;transition:background .3s,color .3s}button,input,textarea{font:inherit}button{cursor:pointer}main{width:min(1180px,calc(100% - 40px));margin:34px auto 60px}.shell{background:var(--paper);border-radius:28px;padding:30px;transition:background .3s}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{margin:0;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.topbar h1{margin:3px 0 0;font-size:28px;letter-spacing:-.03em}.top-actions{display:flex;gap:8px}.app-button.compact{min-height:34px;padding:0 12px;font-size:11px}.app-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 17px;border:1px solid transparent;border-radius:12px;background:#e8e5ec;color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap;transition:background-color .35s ease,color .35s ease,border-color .35s ease,transform .18s ease}.app-button:hover{background:#dedbe4;box-shadow:none;transform:scale(1.02)}.app-button.primary{border-color:transparent;background:var(--accent);color:#302b1f;font-weight:800}.app-button.danger{color:#bd5f68} [data-theme=dark] .app-button:not(.primary){background:#454545;color:#f2f2f2} [data-theme=dark] .app-button:not(.primary):hover{background:#4d4d4d} [data-theme=dark] input,[data-theme=dark] textarea{background:#454545;color:#f2f2f2} [data-theme=dark] input:focus,[data-theme=dark] textarea:focus{background:var(--focus-bg);border-color:var(--focus-border)}.app-button:focus-visible,.checkbox input:focus-visible + span{outline:2px solid color-mix(in srgb,var(--accent) 68%,transparent);outline-offset:2px}.hidden{display:none!important}.login-card{max-width:520px;margin:80px auto}.login-card h1{margin:0 0 24px;font-size:30px}.field{display:grid;gap:7px;margin-top:14px}.field label{font-size:12px;font-weight:800;color:var(--muted)}input,textarea{width:100%;height:44px;min-height:44px;border:2px solid transparent;border-radius:12px;padding:0 13px;background:#f4f2f6;color:var(--ink);transition:background-color .2s,border-color .2s,box-shadow .2s}.field-shell{position:relative;min-width:0;height:44px}.field-shell input{width:100%;height:100%}.textarea-shell{height:auto}.field-shell textarea{width:100%;height:108px}@keyframes inputFocusBorderAnim{from{inset:0;opacity:1;border-radius:12px}to{inset:-8px;opacity:0;border-radius:16px}}.field-shell:not(.disabled):has(input:focus)::after,.field-shell:not(.disabled):has(textarea:focus)::after{content:"";display:block;position:absolute;inset:0;z-index:2;border:2px solid var(--focus-border);border-radius:12px;opacity:0;pointer-events:none;animation:inputFocusBorderAnim .5s}input[type=checkbox]{position:absolute;top:50%;left:0;width:16px;height:16px;margin:0;opacity:0;transform:translateY(-50%)}.checkbox{position:relative;display:inline-flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap;align-self:end;padding:12px 0}.checkbox>span:first-of-type{display:block;flex:0 0 16px;width:16px;height:16px;border:1.5px solid color-mix(in srgb,var(--accent) 62%,var(--muted));border-radius:50%;background:transparent;transition:background-color .35s ease,border-color .35s ease}.checkbox input:hover + span{border-color:var(--accent)}.checkbox input:checked + span{border-color:var(--accent);background:var(--accent)}input:focus,textarea:focus{border-color:var(--focus-border);background:#f4f2f6;box-shadow:none;outline:none}textarea{height:auto;min-height:108px;padding:12px 13px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.toolbar h2{margin:0;font-size:19px}.status{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(330px,390px) 1fr;gap:28px;align-items:start}.editor{padding:20px;border-radius:20px;background:color-mix(in srgb,var(--paper) 86%,var(--control));position:sticky;top:18px}.editor h2{margin:0 0 12px;font-size:18px}.editor-actions{display:flex;gap:8px;margin-top:18px}.upload-box{display:grid;gap:10px;margin-top:14px}.crop-preview{aspect-ratio:16/9;overflow:hidden;border-radius:15px;background:color-mix(in srgb,var(--control) 90%,var(--paper));display:grid;place-items:center}.crop-preview img{width:100%;height:100%;object-fit:cover}.crop-preview span{color:var(--muted);font-size:12px}.events{min-width:0}.event-list{display:grid;gap:12px}.event-card{display:grid;grid-template-columns:24px 170px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border:0;border-radius:18px;background:color-mix(in srgb,var(--paper) 86%,var(--control));transition:background .2s,transform .2s}.event-card:hover{background:color-mix(in srgb,var(--paper) 76%,var(--control));transform:translateY(-1px)}.event-card.dragging{opacity:.55}.event-card.drag-over{background:color-mix(in srgb,var(--accent) 18%,var(--paper))}.event-card img{grid-column:2;width:170px;height:96px;object-fit:cover;border-radius:12px;background:var(--control)}.event-card h3{margin:0 0 4px;font-size:15px}.event-card p{margin:0 0 7px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:11px}.badge{padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 28%,var(--control));color:var(--ink);font-weight:800}.badge.off{background:var(--control);color:var(--muted)}.card-actions{display:flex;flex-direction:column;gap:7px}.icon-btn{min-height:34px;padding:0 12px;background:transparent;color:var(--muted);font-size:11px;font-weight:500}.icon-btn:hover{background:#dedbe4;color:var(--ink);transform:scale(1.02)}.drag-handle{grid-column:1;color:var(--muted);font-size:18px;cursor:grab;user-select:none;text-align:center}.event-card>div:not(.card-actions){grid-column:3;min-width:0}.empty{padding:40px;text-align:center;color:var(--muted);border-radius:18px;background:color-mix(in srgb,var(--paper) 84%,var(--control))}.hint{margin:7px 0 0;color:var(--muted);font-size:11px}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;padding:12px 15px;border-radius:12px;background:var(--ink);color:var(--paper);opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:880px){main{width:min(100% - 22px,680px);margin:12px auto 30px}.shell{padding:20px}.workspace{grid-template-columns:1fr}.editor{position:static}.event-card{grid-template-columns:20px 110px minmax(0,1fr)}.event-card img{grid-column:2;width:110px;height:76px}.event-card>div:not(.card-actions){grid-column:3}.card-actions{grid-column:3;flex-direction:row;flex-wrap:wrap}.field-row{grid-template-columns:1fr}.top-actions{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
<main>
  <section id="login" class="shell login-card">
    <p class="eyebrow">CHUNITHM LAUNCHER / ACTIVITY SERVICE</p><h1>活动管理</h1>
    <form id="loginForm"><div class="field"><label>管理员账号</label><div class="field-shell"><input name="username" value="admin" autocomplete="username" required></div></div><div class="field"><label>管理员密码</label><div class="field-shell"><input name="password" type="password" autocomplete="current-password" required></div></div><button class="app-button primary" style="margin-top:18px">登录后台</button></form>
  </section>
  <section id="panel" class="shell hidden">
    <header class="topbar"><div><p class="eyebrow">CHUNITHM LAUNCHER / ACTIVITY SERVICE</p><h1>活动管理</h1></div><div class="top-actions"><button id="theme" class="app-button" type="button">深色模式</button><button id="logout" class="app-button" type="button">退出</button></div></header>
    <div class="toolbar"><div><h2>活动内容</h2><span class="status">拖动卡片可以调整首页展示顺序</span></div><button id="newEvent" class="app-button primary" type="button">＋ 新增活动</button></div>
    <div class="workspace">
      <form id="eventForm" class="editor" enctype="multipart/form-data">
        <input name="id" type="hidden"><h2 id="formTitle">新增活动</h2>
        <div class="field"><label>标题</label><div class="field-shell"><input name="title" maxlength="120" placeholder="例如：心跳文学部联动活动" required></div></div>
        <div class="field"><label>活动描述</label><div class="field-shell textarea-shell"><textarea name="description" maxlength="4000" placeholder="会显示在启动器首页最新资讯卡片中"></textarea></div></div>
        <div class="field"><label>原文链接</label><div class="field-shell"><input name="originalUrl" type="url" placeholder="https://example.com/event"></div></div>
        <div class="field-row"><div class="field"><label for="publishedAt">发布日期</label><div class="field-shell"><input id="publishedAt" name="publishedAt" type="date"></div></div><div class="field"><label for="expiresAt">结束日期</label><div class="field-shell"><input id="expiresAt" name="expiresAt" type="date"></div></div></div>
        <div class="field-row"><div class="field"><label for="sortOrder">排序值</label><div class="field-shell"><input id="sortOrder" name="sortOrder" type="number" value="0"></div></div><label class="checkbox enabled-toggle" for="enabled"><input id="enabled" name="enabled" type="checkbox" checked><span aria-hidden="true"></span><span>启用展示</span></label></div>
        <div class="upload-box"><label class="app-button" style="text-align:center">选择活动图片<input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><div class="crop-preview"><span id="previewEmpty">16:9 裁剪预览</span><img id="previewImage" class="hidden" alt="活动图片预览"></div><p class="hint">上传后会按首页活动卡片比例居中裁剪预览。</p></div>
        <div class="editor-actions"><button id="submitEvent" class="app-button primary" type="submit">上传并发布</button><button id="cancelEdit" class="app-button hidden" type="button">取消编辑</button></div>
      </form>
      <section class="events"><div id="items" class="event-list"></div></section>
    </div>
  </section>
</main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), form=$('#eventForm'), preview=$('#previewImage'), empty=$('#previewEmpty'), toastNode=$('#toast');let items=[];let editingId='';let dragId='';let previewUrl='';
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok){const body=await r.text();try{const parsed=JSON.parse(body);throw new Error(parsed.error||parsed.message||body)}catch(error){if(error instanceof SyntaxError)throw new Error(body);throw error}}return r.status===204?null:r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message){toastNode.textContent=message;toastNode.classList.add('show');clearTimeout(toastNode.timer);toastNode.timer=setTimeout(()=>toastNode.classList.remove('show'),2600)}
function isoInput(value){if(!value)return '';const date=new Date(value);if(Number.isNaN(date.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
function utcValue(value,includeDate){if(!value)return '';const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));if(!match)return '';const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3])+(includeDate?1:0));return Number.isNaN(date.getTime())?'':date.toISOString()}
function resetForm(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}form.reset();editingId='';form.elements.id.value='';form.elements.sortOrder.value='0';form.elements.enabled.checked=true;form.elements.image.required=true;$('#formTitle').textContent='新增活动';$('#submitEvent').textContent='上传并发布';$('#cancelEdit').classList.add('hidden');preview.classList.add('hidden');preview.removeAttribute('src');empty.classList.remove('hidden')}
function editItem(item){editingId=item.id;form.elements.id.value=item.id;form.elements.title.value=item.title;form.elements.description.value=item.description||'';form.elements.originalUrl.value=item.originalUrl||'';form.elements.publishedAt.value=isoInput(item.publishedAt);form.elements.expiresAt.value=isoInput(item.expiresAt);form.elements.sortOrder.value=item.sortOrder;form.elements.enabled.checked=item.enabled;form.elements.image.required=false;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';preview.src=item.imageUrl;preview.classList.remove('hidden');empty.classList.add('hidden');$('#formTitle').textContent='编辑活动';$('#submitEvent').textContent='保存修改';$('#cancelEdit').classList.remove('hidden');toast('已载入活动内容，未重新选择图片时会保留当前图片')}
async function persistOrder(previous){try{await Promise.all(items.map(x=>{const f=new FormData();f.set('title',x.title);f.set('description',x.description||'');if(x.originalUrl)f.set('originalUrl',x.originalUrl);f.set('publishedAt',x.publishedAt);if(x.expiresAt)f.set('expiresAt',x.expiresAt);f.set('sortOrder',String(x.sortOrder));if(x.enabled)f.set('enabled','true');return api('/api/v1/admin/events/'+x.id,{method:'PUT',body:f})}));toast('展示顺序已保存')}catch(err){if(previous){items=previous;render()}toast('排序保存失败：'+err.message)}}
function moveItem(id,delta){const previous=items.map(x=>({...x})),from=items.findIndex(x=>x.id===id),to=from+delta;if(from<0||to<0||to>=items.length)return;const [moved]=items.splice(from,1);items.splice(to,0,moved);items=items.map((x,i)=>({...x,sortOrder:i}));render();persistOrder(previous)}
function render(){const list=$('#items');if(!items.length){list.innerHTML='<div class="empty">还没有活动，先创建一条活动内容。</div>';return}list.innerHTML=items.map(x=>`<article class="event-card" draggable="true" data-id="${x.id}"><span class="drag-handle" title="拖动排序">⋮⋮</span><img src="${esc(x.imageUrl)}" alt=""><div><h3>${esc(x.title)}</h3><p>${esc(x.description||'暂无描述')}</p><div class="meta"><span class="badge ${x.enabled?'':'off'}">${x.enabled?'已启用':'已停用'}</span><span>排序 ${x.sortOrder}</span><span>${new Date(x.publishedAt).toLocaleDateString('zh-CN')}</span></div></div><div class="card-actions"><button class="app-button compact icon-btn" data-move-up="${x.id}" type="button" aria-label="上移活动">↑</button><button class="app-button compact icon-btn" data-move-down="${x.id}" type="button" aria-label="下移活动">↓</button><button class="app-button compact icon-btn" data-edit="${x.id}" type="button">编辑</button><button class="app-button compact icon-btn" data-delete="${x.id}" type="button">删除</button></div></article>`).join('');wireDrag();document.querySelectorAll('[data-move-up]').forEach(b=>b.onclick=()=>moveItem(b.dataset.moveUp,-1));document.querySelectorAll('[data-move-down]').forEach(b=>b.onclick=()=>moveItem(b.dataset.moveDown,1));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(items.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条活动？'))return;try{await api('/api/v1/admin/events/'+b.dataset.delete,{method:'DELETE'});items=items.filter(x=>x.id!==b.dataset.delete);render();toast('活动已删除')}catch(e){toast(e.message)}})}
function wireDrag(){document.querySelectorAll('.event-card').forEach(card=>{card.ondragstart=()=>{dragId=card.dataset.id;card.classList.add('dragging')};card.ondragend=()=>{dragId='';card.classList.remove('dragging');document.querySelectorAll('.event-card').forEach(x=>x.classList.remove('drag-over'))};card.ondragover=e=>{e.preventDefault();if(card.dataset.id!==dragId)card.classList.add('drag-over')};card.ondragleave=()=>card.classList.remove('drag-over');card.ondrop=async e=>{e.preventDefault();const previous=items.map(x=>({...x})),from=items.findIndex(x=>x.id===dragId),to=items.findIndex(x=>x.id===card.dataset.id);if(from<0||to<0||from===to)return;const [moved]=items.splice(from,1);items.splice(to,0,moved);items=items.map((x,i)=>({...x,sortOrder:i}));render();persistOrder(previous)}})}
async function refresh(){items=await api('/api/v1/admin/events');items.sort((a,b)=>a.sortOrder-b.sortOrder||new Date(b.publishedAt)-new Date(a.publishedAt));render()}
async function boot(){try{const s=await api('/api/v1/admin/session');$('#login').classList.toggle('hidden',s.authenticated);$('#panel').classList.toggle('hidden',!s.authenticated);if(s.authenticated)refresh()}catch(e){toast(e.message)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(e){toast('登录失败')}};
async function cropImage(file){try{let source;if(window.createImageBitmap)source=await createImageBitmap(file);else source=await new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=reject;img.src=url});const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const scale=Math.max(canvas.width/source.width,canvas.height/source.height),w=source.width*scale,h=source.height*scale;canvas.getContext('2d').drawImage(source,(canvas.width-w)/2,(canvas.height-h)/2,w,h);if(source.close)source.close();return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob||file),'image/webp',.9))}catch{return file}}
$('#eventForm').onsubmit=async e=>{e.preventDefault();try{const data=new FormData(form),id=data.get('id');if(!id&&!data.get('image')?.name)throw new Error('新增活动必须上传图片');data.set('publishedAt',utcValue(data.get('publishedAt')));if(data.get('expiresAt'))data.set('expiresAt',utcValue(data.get('expiresAt'),true));if(data.get('image')?.name){const image=data.get('image'),cropped=await cropImage(image);data.delete('image');data.append('image',cropped,`${image.name.replace(/\.[^.]+$/,'')}.webp`)}await api(id?'/api/v1/admin/events/'+id:'/api/v1/admin/events',{method:id?'PUT':'POST',body:data});resetForm();await refresh();toast(id?'活动已保存':'活动已发布')}catch(e){toast(e.message)}};
$('#image').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.classList.remove('hidden');empty.classList.add('hidden')};$('#cancelEdit').onclick=resetForm;$('#newEvent').onclick=()=>{resetForm();form.scrollIntoView({behavior:'smooth'})};$('#logout').onclick=async()=>{await api('/api/v1/admin/logout',{method:'POST'});boot()};$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';$('#theme').textContent=dark?'浅色模式':'深色模式';localStorage.setItem('activity-theme',dark?'dark':'light')};if(localStorage.getItem('activity-theme')==='dark'){$('#theme').click()}resetForm();boot();
</script>
</body></html>
