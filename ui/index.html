<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chunithm Launcher</title>
  <script>if (localStorage.getItem('chunithm-theme') === 'dark') document.documentElement.classList.add('theme-dark-preload');</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="blob blob-a"></div><div class="blob blob-b"></div><div class="texture"></div>
    <main class="shell">
      <header class="topbar entrance e1">
        <nav class="app-switcher" aria-label="页面切换"><button id="portalTab">打开MuNET</button></nav>
        <div class="top-actions"><span class="status-pill"><i id="statusDot"></i><span id="statusText">待机</span></span><button class="app-button theme-button" id="themeToggle"><svg class="theme-icon" id="themeIcon" viewBox="0 0 1024 1024" aria-hidden="true"></svg><span id="themeLabel">深色</span></button><button class="app-button" id="btnSettings">设置</button></div>
      </header>
      <section class="grid">
        <article class="app-panel status-panel entrance e2">
          <div class="target-label">目标模式</div><div class="target-value" id="targetMode">1920×1080 @ 120Hz</div>
          <div class="stats"><div><span>原始分辨率</span><b id="originalMode">未读取</b></div><div><span>主显示器</span><b id="primaryDisplay">未选择</b></div></div>
          <hr />
          <label class="target-label launch-mode-label">启动模式</label>
          <div class="segmented" id="launchMode"><button data-mode="smart" class="active">智能切换</button><button data-mode="manual">仅启动</button></div>
          <div class="bottom-controls"><label class="checkbox"><input type="checkbox" id="smartDisplayToggle" /><span></span>独占显示器</label><button class="app-button compact" id="btnTestSwitch">测试切换</button></div>
        </article>
        <article class="app-panel launch-panel entrance e3">
          <span class="visually-hidden" id="startBatPath" aria-hidden="true"></span>
          <button class="app-button primary launch" id="btnLaunch">▶　启动游戏</button>
        </article>
      </section>
      <footer><span id="version">v2.0.0</span></footer>
    </main>

    <section class="portal-view" id="portalView" aria-label="MuNET 网页视图"><div class="portal-toolbar"><button class="app-button compact" id="backToLauncher">←　返回启动器</button><span id="portalViewTitle">MuNET</span></div><iframe id="portalFrame" title="MuNET" referrerpolicy="no-referrer"></iframe></section>
  </div>

  <div class="modal-backdrop" id="firstRun"><div class="modal-card"><h2>首次配置</h2><p>先完成游戏路径、主显示器和界面主题配置。</p><div class="section"><h3>启动与显示器</h3><label>start.bat 路径</label><div class="row"><div class="field-shell"><input id="startBat" readonly placeholder="请选择 start.bat" /></div><button class="app-button compact" id="btnPickBat">选择</button></div><label>主显示器</label><div class="row display-select-row"><div class="display-picker" id="displayDropdownFirstRun"><button type="button" class="display-picker-trigger" id="displaySelectTriggerFirstRun" aria-haspopup="listbox" aria-expanded="false"><span id="displaySelectValueFirstRun">请选择主显示器</span><span class="display-picker-chevron" aria-hidden="true"></span></button><div class="display-picker-panel" id="displaySelectPanelFirstRun" role="listbox"><div class="display-picker-options" id="displaySelectOptionsFirstRun"></div></div><select id="displaySelect" class="visually-hidden" tabindex="-1" aria-hidden="true"><option value="">请选择主显示器</option></select></div><button class="app-button compact" id="btnDetectDisplays">刷新</button></div><label>界面主题</label><div class="row"><select id="themeSelect"><option value="light">浅色模式</option><option value="dark">深色模式</option></select></div></div><button class="app-button primary wide" id="btnSave">完成配置</button></div></div>
  <div class="modal-backdrop" id="settingsModal"><div class="modal-card settings"><div class="modal-heading"><div><h2>设置</h2><p>调整启动路径、显示器、分辨率和界面外观。</p></div><button class="app-button" id="btnCloseSettings">关闭</button></div><div class="scroll-body">
    <div class="section"><h3>启动与分辨率</h3><label>start.bat 路径</label><div class="row"><div class="field-shell"><input id="startBatSetting" readonly placeholder="请选择 start.bat" /></div><button class="app-button compact" id="btnPickBatSetting">选择</button></div><div class="row wrap"><button class="app-button compact" id="btnEditSegatoolsIni">编辑 segatools.ini</button><button class="app-button compact" id="btnApplyRecommendedSegatools">使用推荐配置</button></div><label>主显示器 <small>选择后立即保存</small></label><div class="row display-select-row"><div class="display-picker" id="displayDropdownSetting"><button type="button" class="display-picker-trigger" id="displaySelectTrigger" aria-haspopup="listbox" aria-expanded="false"><span id="displaySelectValue">请选择主显示器</span><span class="display-picker-chevron" aria-hidden="true"></span></button><div class="display-picker-panel" id="displaySelectPanel" role="listbox"><div class="display-picker-options" id="displaySelectOptions"></div></div><select id="displaySelectSetting" class="visually-hidden" tabindex="-1" aria-hidden="true"><option value="">请选择主显示器</option></select></div><button class="app-button compact" id="btnDetectDisplaysSetting">刷新</button></div><label>原始分辨率</label><div class="row"><div class="field-shell"><input id="originalModeInputSetting" placeholder="例如 2560×1440 @ 144Hz" /></div><button class="app-button compact" id="btnReadCurrentSetting">读取</button></div><label>目标分辨率</label><div class="row"><div class="field-shell"><input id="targetModeSetting" readonly value="1920×1080 @ 120Hz" /></div><label class="checkbox"><input type="checkbox" id="target60HzToggle" /><span></span>60Hz</label></div></div>
    <div class="section"><h3>外观</h3><label>主题色</label><div class="row"><input type="color" id="themeColor" value="#fdd500" /><div class="field-shell"><input id="themeColorText" value="#fdd500" /></div></div><label>背景图片</label><div class="row"><div class="field-shell"><input id="bgImageInput" placeholder="本地路径或 URL" /></div><button class="app-button compact" id="btnBrowseBg">浏览</button></div></div>
    <div class="section"><h3>ALL.Net提供商</h3><label>按钮文字</label><div class="row"><div class="field-shell"><input id="portalButtonText" placeholder="打开MuNET" /></div></div><label>网页链接</label><div class="row"><div class="field-shell"><input id="portalUrl" placeholder="https://portal.mumur.net/" /></div></div></div><div class="section"><h3>关于</h3><div class="about-row"><span>项目主页</span><button class="app-button compact" id="btnOpenGithubHome">GitHub 主页</button><span>版本更新</span><button class="app-button compact" id="btnCheckUpdate">检查更新</button></div></div>
    </div><button class="app-button primary wide" id="btnSaveSettings">保存设置</button></div></div>
  <script src="app.js"></script>
</body>
</html>
