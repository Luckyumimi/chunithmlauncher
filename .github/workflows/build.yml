name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore .\ChunithmLauncher\ChunithmLauncher.csproj --configfile .\NuGet.Config
          dotnet restore .\ChunithmLauncher.Bootstrapper\ChunithmLauncher.Bootstrapper.csproj --configfile .\NuGet.Config

      - name: Build
        run: |
          dotnet build .\ChunithmLauncher\ChunithmLauncher.csproj -c Release --no-restore
          dotnet build .\ChunithmLauncher.Bootstrapper\ChunithmLauncher.Bootstrapper.csproj -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: |
          .\publish.ps1 -Configuration Release -Runtime win-x64 -OutputRoot "artifacts\github-action"
          $latestPublish = Get-ChildItem "artifacts\github-action" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          Move-Item -Path $latestPublish.FullName -Destination "artifacts\github-action\publish"

      - name: Upload publish
        uses: actions/upload-artifact@v4
        with:
          name: ChunithmLauncher-win-x64
          path: artifacts/github-action/publish
          if-no-files-found: error
